# Enam boss RPG. Spawn manual dengan /mm mobs spawn <ID>. Tidak ada random spawn.
RPG_FrostWarden:
  Type: STRAY
  Display: '&b&lFrost Warden'
  Health: 650
  Damage: 8
  Armor: 8
  Faction: YTBRPG_Bosses
  BossBar:
    Enabled: true
    Title: '&b&lFrost Warden'
    Range: 48
    Color: BLUE
    Style: SEGMENTED_10
    CreateFog: false
    DarkenSky: false
    PlayMusic: false
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  - randomlookaround
  AITargetSelectors:
  - clear
  - players
  - attacker
  Options:
    AlwaysShowName: true
    MovementSpeed: 0.25
    FollowRange: 32
    MaxCombatDistance: 48
    KnockbackResistance: 0.8
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventItemPickup: true
    PreventSunburn: true
    PreventTransformation: true
    Despawn: CHUNK
    Scale: 1.4
  Skills:
  - skill{s=YTBRPG_FrostNova} @self ~onTimer:180
  - skill{s=YTBRPG_Rage} @self ~onTimer:200
  Drops:
  - EMERALD 4to8 1
  - DIAMOND 1to2 0.35
  Equipment:
  - IRON_SWORD HAND
