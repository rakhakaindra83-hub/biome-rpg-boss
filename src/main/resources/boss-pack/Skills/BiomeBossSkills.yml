# Skill bawaan MythicMobs: telegraph 1 detik, damage mengikuti armor, tanpa perusakan blok.
YTBRPG_FrostNova:
  Cooldown: 9
  Conditions:
  - incombat
  - targetwithin{d=20}
  Skills:
  - message{m="&bFrost Warden &7menyiapkan serangan area - menjauh!"} @PlayersInRadius{r=16}
  - effect:particles{p=SNOWFLAKE;amount=50;hSpread=3;ySpread=0.4;speed=0.02} @self
  - delay 20
  - damage{amount=6;ignoreArmor=false} @PlayersInRadius{r=6}
  - potion{type=SLOW;duration=60;level=1} @PlayersInRadius{r=6}
